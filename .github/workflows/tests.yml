name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements_test.txt
      - name: Run tests with coverage
        run: >-
          pytest
          --cov=custom_components.corvallis_transit
          --cov-report=term-missing
          --cov-fail-under=95
